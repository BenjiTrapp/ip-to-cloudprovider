name: Daily scrape of CloudProvider IP Ranges and updating the files in the repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-ip-ranges:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: make build

      # Allowed to fail: a single broken provider must not stop the others from
      # being refreshed and committed. The outcome is inspected below so the job
      # still turns red (and notifies) when something breaks.
      - name: Update all provider IP ranges
        id: update
        continue-on-error: true
        run: make update

      - name: Commit and push if changed
        run: |
          git config user.name "AutomatedDailyUpdater"
          git config user.email "benji@no.reply"
          git add -A
          timestamp=$(date -u)
          git commit -m "Update CloudProvider IpRanges: ${timestamp}" || exit 0
          git push

      - name: Fail if any provider failed to update
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::One or more providers failed to update. See the 'Update all provider IP ranges' step logs."
          exit 1
