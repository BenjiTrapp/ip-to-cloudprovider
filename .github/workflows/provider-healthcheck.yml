name: Provider healthcheck

# Live-checks every provider's upstream source so endpoint/format changes are
# caught early — independent of whether the daily scraper produced a diff.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: make build

      # Capture stdout+stderr (OK lines go to stdout, FAIL lines to stderr) and
      # preserve the non-zero exit code via pipefail so the job fails on breakage.
      - name: Run provider healthcheck
        id: hc
        run: |
          set -o pipefail
          ./ip-to-cloudprovider healthcheck -q 2>&1 | tee healthcheck.txt

      - name: Open or update issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Provider healthcheck failed"
          report="$(cat healthcheck.txt 2>/dev/null || echo '(no output captured)')"
          body=$(printf 'The scheduled provider healthcheck failed on %s.\n\nOne or more upstream provider sources are unreachable or changed format.\n\n```\n%s\n```\n\nReproduce locally: `ip-to-cloudprovider healthcheck`\n\nWorkflow run: %s/%s/actions/runs/%s' \
            "$(date -u)" "$report" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -b "$body"
          else
            gh issue create -t "$title" -b "$body"
          fi
